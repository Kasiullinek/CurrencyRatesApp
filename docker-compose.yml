services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: currency_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: fastapi_backend
    depends_on:
      - db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: currency_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: always

  backend-tests:
    build: ./backend
    container_name: fastapi_tests
    depends_on:
      - db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: currency_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./backend:/app
    command: >
      pytest app/tests -v

  frontend:
    build: ./frontend/app
    container_name: angular_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
  
  frontend-tests:
    build: ./frontend/app
    container_name: angular_frontend_tests
    command: >
      npx ng test --watch=false --browsers=ChromeHeadlessDocker

volumes:
  postgres_data:
